<jti-card-layout>
	<h1 class="auth-card__title">Reset password</h1>

	@if (email(); as email) {
		<jti-set-password-form
			submitLabel="Reset password"
			[email]="email"
			[submitAction]="resetPassword"
			(succeeded)="onPasswordReset()"
		/>
	} @else {
		<p class="auth-card__error" role="alert">This password reset link is invalid or has expired.</p>
		<a class="auth-card__link" routerLink="/forgot-password">Request a new link</a>
	}
</jti-card-layout>
