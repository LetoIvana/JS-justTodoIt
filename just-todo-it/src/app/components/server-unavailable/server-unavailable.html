<main class="server-unavailable">
	<mat-card class="server-unavailable__card" appearance="raised">
		<mat-card-content>
			<h1 class="auth-card__title">Server unavailable</h1>
			<p class="server-unavailable__description" role="alert">
				We can't reach the server right now. Please try again in a moment.
			</p>
			<button mat-flat-button type="button" (click)="retry()">Try again</button>
		</mat-card-content>
	</mat-card>
</main>
